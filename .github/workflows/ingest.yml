name: Ingest public signals
run-name: Read-only Turso connection diagnostic
on:
  workflow_dispatch:
    inputs:
      enrichment_provider:
        type: choice
        default: repository
        options: [repository, heuristic, xkiro, openai]
      check_configuration:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  probe:
    name: Read-only Turso connection probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe connectivity and migration history with read-only SQL
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { createClient } from '@libsql/client';
          import { z } from 'zod';
          let client;
          let stage = 'configuration';
          try {
            const config = z.object({ TURSO_DATABASE_URL: z.string().min(1), TURSO_AUTH_TOKEN: z.string().min(1) }).parse(process.env);
            const url = new URL(config.TURSO_DATABASE_URL);
            if (!['libsql:', 'https:'].includes(url.protocol) || url.username || url.password) throw new Error('INVALID_DATABASE_CONFIGURATION');
            const parts = config.TURSO_AUTH_TOKEN.split('.');
            if (parts.length === 3) {
              try {
                const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
                console.info(JSON.stringify({ event: 'database.token_metadata', expired: typeof claims.exp === 'number' && claims.exp <= Date.now() / 1000 }));
              } catch { console.info(JSON.stringify({ event: 'database.token_metadata', tokenFormat: 'unknown' })); }
            }
            client = createClient({ url: config.TURSO_DATABASE_URL, authToken: config.TURSO_AUTH_TOKEN, fetch: async (input, init) => {
              const response = await fetch(input, { ...init, signal: AbortSignal.timeout(8000) });
              if (!response.ok) console.info(JSON.stringify({ event: 'database.http_status', status: response.status }));
              return response;
            } });
            stage = 'connection';
            z.literal(1).parse((await client.execute('SELECT 1 AS connected')).rows[0]?.connected);
            console.info(JSON.stringify({ event: 'database.connected' }));
            stage = 'schema';
            const table = await client.execute({ sql: 'SELECT count(*) AS count FROM sqlite_master WHERE type=? AND name=?', args: ['table', 'schema_migrations'] });
            const exists = z.number().int().nonnegative().parse(table.rows[0]?.count);
            if (exists) {
              const history = await client.execute('SELECT version,name FROM schema_migrations ORDER BY version');
              const migrations = z.array(z.object({ version: z.number().int(), name: z.string() })).parse(history.rows);
              console.info(JSON.stringify({ event: 'database.migration_history', migrations }));
            } else console.info(JSON.stringify({ event: 'database.migration_history', migrations: [], initialized: false }));
          } catch (error) {
            const known = new Set(['SERVER_ERROR', 'HTTP_SERVER_ERROR', 'SQLITE_AUTH', 'SQLITE_ERROR', 'SQLITE_READONLY', 'SQLITE_NOTADB', 'SQLITE_CANTOPEN', 'HRANA_PROTO_ERROR', 'URL_INVALID', 'URL_PARAM_NOT_SUPPORTED']);
            const code = error && typeof error === 'object' && known.has(error.code) ? error.code : 'DATABASE_PROBE_FAILED';
            const status = error && typeof error === 'object' && typeof error.status === 'number' ? error.status : null;
            console.error(JSON.stringify({ event: 'database.probe_failed', stage, code, status }));
            process.exitCode = 1;
          } finally { client?.close(); }
          JS
