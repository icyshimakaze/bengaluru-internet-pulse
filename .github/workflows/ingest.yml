name: Ingest public signals
on:
  workflow_dispatch:
    inputs:
      enrichment_provider:
        required: false
        type: string
        default: heuristic
      check_configuration:
        required: false
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe official public search hosts without credentials
        run: |
          node --input-type=module <<'NODE'
          const now = new Date();
          const params = new URLSearchParams({ q: 'Bengaluru', sort: 'latest', limit: '1', since: new Date(now.getTime()-86400000).toISOString(), until: now.toISOString() });
          for (const host of ['public.api.bsky.app', 'api.bsky.app']) {
            const start = Date.now();
            try {
              const response = await fetch('https://' + host + '/xrpc/app.bsky.feed.searchPosts?' + params, { headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(8000), cache: 'no-store', credentials: 'omit' });
              const body = await response.json().catch(() => null);
              console.info(JSON.stringify({ event: 'source.probe', host, status: response.status, ms: Date.now()-start, count: Array.isArray(body?.posts) ? body.posts.length : null, error: typeof body?.error === 'string' ? body.error.slice(0,80) : undefined }));
            } catch (error) {
              console.info(JSON.stringify({ event: 'source.probe', host, ms: Date.now()-start, error: error.name }));
            }
          }
          NODE
