name: Ingest public signals
on:
  workflow_dispatch:
    inputs:
      enrichment_provider:
        type: string
        default: heuristic
      check_configuration:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pulse-production-ingestion
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit and repair reproduced category leaks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          npm run audit:data
          node --conditions=react-server --import tsx scripts/repair-data-categories.ts --apply
      - name: Fresh public ingestion using repaired matching
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ENRICHMENT_PROVIDER: heuristic
          APP_DATA_MODE: live
        run: npm run ingest -- --require-remote
      - name: Inspect stored output and sample source link reachability
        if: always()
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          npm run audit:data
          node scripts/audit-remote-data.mjs after
          node scripts/check-audit-links.mjs
