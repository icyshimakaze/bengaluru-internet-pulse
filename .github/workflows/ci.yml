name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build with xKiro selected and no provider credentials
        run: npm run build
        env:
          ENRICHMENT_PROVIDER: xkiro
          OPENAI_API_KEY: ""
          OPENAI_MODEL: ""
          XKIRO_API_KEY: ""
          XKIRO_BASE_URL: ""
          XKIRO_MODEL: ""
      - name: Build with OpenAI selected and no provider credentials
        run: npm run build
        env:
          ENRICHMENT_PROVIDER: openai
          OPENAI_API_KEY: ""
          OPENAI_MODEL: ""
          XKIRO_API_KEY: ""
          XKIRO_BASE_URL: ""
          XKIRO_MODEL: ""
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
